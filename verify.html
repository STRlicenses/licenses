<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STR License Verification</title>
<style>
  :root{
    --gov:#1f3a5f;
    --accent:#4a69d9;
    --green:#2e7d47;
    --green-bg:#e8f5ec;
    --ink:#1a2233;
    --muted:#6b7688;
    --line:#e6e9ef;
    --bg:#f4f5f8;
    --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  a{color:var(--accent)}
  header.gov{background:var(--gov);color:#fff;border-bottom:4px solid var(--accent)}
  .gov-inner{max-width:820px;margin:0 auto;padding:22px 20px;display:flex;align-items:center;gap:16px}
  .seal{width:52px;height:52px;border:2px solid rgba(255,255,255,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:1px;flex:0 0 auto}
  .gov-title{font-size:22px;font-weight:700;margin:0}
  .gov-sub{font-size:14px;opacity:.85;margin:2px 0 0}
  main{max-width:820px;margin:0 auto;padding:24px 20px 48px}
  .banner{display:flex;align-items:center;gap:12px;background:var(--green-bg);border:1px solid #bfe3ca;color:var(--green);border-radius:12px;padding:16px 18px;font-size:16px;margin-bottom:22px}
  .banner .tick{width:26px;height:26px;background:var(--green);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:22px}
  .unit-card{border-top:5px solid var(--accent)}
  .unit-name{font-size:30px;font-weight:800;margin:0 0 6px;letter-spacing:-.5px}
  .unit-addr{color:var(--muted);font-size:16px;margin:0 0 16px}
  .pill{display:inline-block;background:var(--green);color:#fff;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px}
  .pill.inactive{background:#b23b3b}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 32px}
  .field .lbl{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .field .val{font-size:17px;font-weight:600}
  .doc-title{font-size:18px;font-weight:700;margin:0 0 16px}
  .pdf-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafbfc}
  .pdf-wrap iframe{width:100%;height:80vh;border:0;display:block}
  .pdf-fallback{font-size:14px;color:var(--muted);margin-top:12px}
  .mgr{text-align:center}
  .mgr .cap{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
  .mgr img{max-height:56px;max-width:220px;margin-bottom:12px}
  .mgr .line{font-size:15px;color:var(--ink)}
  footer{max-width:820px;margin:0 auto;padding:0 20px 40px;text-align:center;color:var(--muted);font-size:13px}
  .error{text-align:center;padding:60px 20px;color:var(--muted)}
  @media(max-width:560px){
    .grid{grid-template-columns:1fr}
    .unit-name{font-size:24px}
    .pdf-wrap iframe{height:calc(100vh - 90px)}
  }
</style>
</head>
<body>
<header class="gov">
  <div class="gov-inner">
    <div class="seal">STR</div>
    <div>
      <h1 class="gov-title">Short-Term Rental License Verification</h1>
      <p class="gov-sub" id="juris">Town of Vail, Colorado</p>
    </div>
  </div>
</header>
<main id="app">
  <div class="error">Loading verification&hellip;</div>
</main>
<footer>
  <p>This verification page reflects the current license on file. Independently issued by the jurisdiction of record.</p>
</footer>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var id = (params.get('id')||'').trim().toLowerCase();
  var app = document.getElementById('app');
  function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
  function render(data){
    var mgr = data.manager||{};
    document.getElementById('juris').textContent = data.jurisdiction||'';
    if(!id){ app.innerHTML='<div class="error">No property specified. Add <code>?id=</code> to the URL.</div>'; return; }
    var p = (data.properties||{})[id];
    if(!p){ app.innerHTML='<div class="error">No license record found for this property.</div>'; document.title='License Not Found'; return; }
    document.title = 'STR License Verification \u2014 ' + p.name;
    var active = (p.status||'').toLowerCase()==='active';
    var pdfSrc = p.pdf ? esc(p.pdf) + '#view=FitH&toolbar=0' : '';
    var pdf = p.pdf ? '<section class="card"><h2 class="doc-title">Official License Document</h2><div class="pdf-wrap"><iframe src="'+pdfSrc+'" title="License PDF"></iframe></div><p class="pdf-fallback">If the document does not display, <a href="'+esc(p.pdf)+'" target="_blank" rel="noopener">open the license PDF</a>.</p></section>' : '';
    var logo = mgr.logo ? '<img src="'+esc(mgr.logo)+'" alt="'+esc(mgr.name)+'">' : '';
    var site = mgr.website ? '<a href="'+esc(mgr.website)+'" target="_blank" rel="noopener">'+esc(mgr.websiteLabel||mgr.website)+'</a>' : '';
    app.innerHTML =
      '<div class="banner"><span class="tick">\u2713</span><div>This unit holds an <strong>'+(active?'active':esc(p.status))+'</strong> short-term rental license.</div></div>'
      + '<section class="card unit-card">'
      +   '<h2 class="unit-name">'+esc(p.name)+'</h2>'
      +   '<p class="unit-addr">'+esc(p.address)+'</p>'
      +   '<span class="pill'+(active?'':' inactive')+'">License '+esc(p.status)+'</span>'
      + '</section>'
      + '<section class="card"><div class="grid">'
      +   field('License Number', p.licenseNumber)
      +   field('License Type', p.licenseType)
      +   field('Issued', p.issued)
      +   field('Expires', p.expires)
      +   field('Jurisdiction', data.jurisdiction)
      +   field('Status', p.status)
      + '</div></section>'
      + pdf
      + '<section class="card mgr"><div class="cap">Property Managed By</div>'+logo+'<div class="line">'+esc(mgr.name)+(site?' \u00b7 '+site:'')+(mgr.phone?' \u00b7 '+esc(mgr.phone):'')+'</div></section>';
  }
  function field(lbl,val){ return '<div class="field"><div class="lbl">'+esc(lbl)+'</div><div class="val">'+esc(val||'\u2014')+'</div></div>'; }
  fetch('properties.json?v='+Date.now())
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function(e){ app.innerHTML='<div class="error">Unable to load license data.</div>'; });
})();
</script>
</body>
</html>
